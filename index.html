<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fuego y Palabra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --parchment:#E9DFC3; --ink:#2B2118; --ink-soft:#4A3B2A;
    --terracotta:#A8452B; --gold:#B4903B;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;font-family:'EB Garamond',serif;background:var(--parchment);color:var(--ink);}
  body{display:flex;align-items:center;justify-content:center;padding:24px;}
  .wrap{max-width:760px;text-align:center;}
  .mark{font-family:'Cinzel',serif;font-weight:700;font-size:13px;letter-spacing:.22em;color:var(--terracotta);text-transform:uppercase;}
  h1{font-family:'Cinzel',serif;font-weight:700;font-size:44px;margin:10px 0 6px;}
  p.sub{font-style:italic;color:var(--ink-soft);margin:0 0 46px;font-size:17px;}
  .cards{display:flex;gap:22px;flex-wrap:wrap;justify-content:center;}
  .card{
    width:280px;background:#FBF6E8;border:1px solid var(--ink);border-radius:4px;
    padding:26px 22px;text-decoration:none;color:var(--ink);
    box-shadow:0 4px 14px rgba(0,0,0,.12);transition:.2s;
  }
  .card:hover{transform:translateY(-4px);box-shadow:0 8px 20px rgba(0,0,0,.18);}
  .card .icon{font-size:30px;margin-bottom:10px;}
  .card h2{font-family:'Cinzel',serif;font-size:19px;margin:0 0 8px;}
  .card p{font-size:14.5px;color:var(--ink-soft);margin:0;line-height:1.4;}
</style>
</head>
<body>
  <div class="wrap">
    <div class="mark">Fuego y Palabra</div>
    <h1>Recursos Bíblicos</h1>
    <p class="sub">Educación bíblica a través de mapas y líneas de tiempo interactivas</p>
    <div class="cards">
      <a class="card" href="Atlas Bíblico/">
        <div class="icon">🗺️</div>
        <h2>Atlas Bíblico</h2>
        <p>Ciudades, batallas, profecías y predicaciones ubicadas en el mapa.</p>
      </a>
      <a class="card" href="Línea de Tiempo de los Reyes/">
        <div class="icon">📜</div>
        <h2>Línea de Tiempo</h2>
        <p>Reyes, jueces y profetas de Israel y Judá en orden cronológico.</p>
      </a>
    </div>
  </div>
</body>
</html>
